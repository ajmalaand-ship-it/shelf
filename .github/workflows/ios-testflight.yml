name: Shelf signed iOS internal TestFlight
# Register this exact file on main before dispatch; never merge iOS source into main.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full ios/foundation commit SHA to build
        type: string
        required: true
      build_number:
        description: Explicit unused positive iOS build number (no default)
        type: string
        required: true
      apple_build_number_unused:
        description: I checked Apple has not received this build number
        type: boolean
        required: true
        default: false
      codemagic_cancelled_before_upload:
        description: Codemagic attempt is confirmed cancelled before upload (required for build 1)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: shelf-signed-ios-testflight
  cancel-in-progress: false
jobs:
  signed-internal-ios:
    if: github.repository == 'ajmalaand-ship-it/shelf' && github.ref == 'refs/heads/ios/foundation'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SHELF_API_BASE_URL: https://shelf.services/api/
      SHELF_SOURCE_SHA: ${{ inputs.source_sha }}
      SHELF_IOS_BUILD_NUMBER: ${{ inputs.build_number }}
      APPLE_NUMBER_UNUSED: ${{ inputs.apple_build_number_unused }}
      CODEMAGIC_CANCELLED_BEFORE_UPLOAD: ${{ inputs.codemagic_cancelled_before_upload }}
    steps:
      - name: Validate deliberate build inputs before accessing credentials
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['SHELF_SOURCE_SHA']), 'Full lowercase source SHA required'
          assert re.fullmatch(r'[1-9][0-9]*',os.environ['SHELF_IOS_BUILD_NUMBER']), 'Positive explicit build number required'
          assert os.environ['APPLE_NUMBER_UNUSED']=='true', 'Confirm Apple has not received this number'
          if os.environ['SHELF_IOS_BUILD_NUMBER']=='1':
              assert os.environ['CODEMAGIC_CANCELLED_BEFORE_UPLOAD']=='true', 'Build 1 requires confirmed Codemagic cancellation before upload'
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # Same as passed unsigned build; v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact source belongs to ios/foundation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHELF_SOURCE_SHA"
          git merge-base --is-ancestor "$SHELF_SOURCE_SHA" refs/remotes/origin/ios/foundation
          test -f scripts/ios/github_testflight.py
      - name: Set isolated temporary directories and install passed Flutter toolchain
        run: |
          set -euo pipefail
          mkdir -p "$HOME/shelf/tmp" "$HOME/shelf/tmp/pub-cache"
          for key in TMPDIR TMP TEMP; do echo "$key=$HOME/shelf/tmp" >> "$GITHUB_ENV"; done
          echo "PUB_CACHE=$HOME/shelf/tmp/pub-cache" >> "$GITHUB_ENV"
          export TMPDIR="$HOME/shelf/tmp" TMP="$HOME/shelf/tmp" TEMP="$HOME/shelf/tmp"
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$HOME/shelf/tmp/flutter"
          echo "$HOME/shelf/tmp/flutter/bin" >> "$GITHUB_PATH"
      - name: Inspect native build toolchain
        working-directory: mobile
        run: |
          set -euo pipefail
          flutter --version
          xcodebuild -version
          pod --version
      - name: Resolve locked Flutter dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Generate native Flutter configuration (no compilation)
        working-directory: mobile
        run: flutter build ios --config-only --release --no-codesign --no-pub
      - name: Install native plugins
        working-directory: mobile/ios
        run: pod install
      - name: Sign, verify and upload internal-only IPA
        env:
          SHELF_IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.SHELF_IOS_DISTRIBUTION_P12_BASE64 }}
          SHELF_IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.SHELF_IOS_DISTRIBUTION_P12_PASSWORD }}
          SHELF_IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.SHELF_IOS_APP_STORE_PROFILE_BASE64 }}
          SHELF_APP_STORE_CONNECT_KEY_ID: ${{ secrets.SHELF_APP_STORE_CONNECT_KEY_ID }}
          SHELF_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.SHELF_APP_STORE_CONNECT_ISSUER_ID }}
          SHELF_APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.SHELF_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 -B scripts/ios/github_testflight.py
      - name: Clean temporary signing credentials even after failure
        if: ${{ always() }}
        run: |
          if test -f scripts/ios/github_testflight.py; then
            python3 -B scripts/ios/github_testflight.py cleanup
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # Same as passed unsigned workflow; v4.6.2
        with:
          name: shelf-ios-internal-${{ inputs.source_sha }}-${{ inputs.build_number }}
          path: |
            mobile/build/ios/ipa/*.ipa
            mobile/build/ios-github-evidence/
          if-no-files-found: error
          retention-days: 7
